<section class="page-head">
  <div class="wrap">
    <p class="section-kicker">Publications</p>
    <h1>Publications</h1>
    <p class="lead">Peer-reviewed work from the lab. Titles link to the publisher or DOI. For the complete, always-current list, see Dr. Tay&rsquo;s <a href="https://scholar.google.com/citations?hl=en&amp;user=5_1xpscAAAAJ" target="_blank" rel="noopener">Google Scholar</a> profile.</p>
  </div>
</section>

<section class="section-tight">
  <div class="wrap">
    <div class="pub-filter" id="pubFilter" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:.5em;font-family:'Cairo',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:13px">
<!--PUB_FILTER-->
    </div>

    <div class="entry-list" id="pubList">
<!--PUBLICATION_ITEMS-->
    </div>
  </div>
</section>

<script>
(function(){
  var bar=document.getElementById('pubFilter');
  if(!bar)return;
  bar.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    var yr=b.getAttribute('data-yr');
    bar.querySelectorAll('button').forEach(function(x){x.classList.toggle('active',x===b);});
    document.querySelectorAll('#pubList .entry').forEach(function(en){
      en.style.display=(yr==='all'||en.getAttribute('data-year')===yr)?'':'none';
    });
  });
})();
</script>
